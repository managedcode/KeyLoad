name: Functional RF3 heavy-load setup
description: Prepare source-bound images and the existing native functional RF3 runner.
inputs:
  bundle-artifact-id:
    description: Same-source immutable Docker image bundle
    required: true
runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - name: Check Docker
      shell: bash
      run: docker version
    - name: Download exact source Docker images
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        artifact-ids: ${{ inputs.bundle-artifact-id }}
        path: ${{ runner.temp }}/keyload-image-bundle
    - name: Load and verify Docker images
      id: images
      shell: bash
      run: node scripts/Features/BenchmarkComparisons/import-images.mjs --bundle="$RUNNER_TEMP/keyload-image-bundle"
    - name: Configure exact source KeyLoad image
      env:
        KEYLOAD_SERVER_IMAGE: ${{ steps.images.outputs.server-image }}
      shell: bash
      run: |
        test -n "$KEYLOAD_SERVER_IMAGE"
        printf 'KeyLoad__ContainerImages__Server=%s\nKEYLOAD_IMAGE_RECEIPT=%s\n' "$KEYLOAD_SERVER_IMAGE" "$RUNNER_TEMP/keyload-images/image-receipt.json" >> "$GITHUB_ENV"
    - name: Restore .NET packages
      shell: bash
      run: dotnet restore KeyLoad.slnx
    - name: Build functional RF3 tests
      shell: bash
      run: dotnet build tests/KeyLoad.IntegrationTests --no-restore --configuration Release -warnaserror
