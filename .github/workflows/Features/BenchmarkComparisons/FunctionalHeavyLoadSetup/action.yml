name: Functional CLUSTER heavy-load setup
description: Build the real native functional cluster tests; Aspire launches server projects and membership storage.
runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - name: Check Docker
      shell: bash
      run: docker version
    - name: Restore .NET packages
      shell: bash
      run: dotnet restore KeyLoad.slnx
    - name: Build functional CLUSTER tests
      shell: bash
      run: dotnet build tests/KeyLoad.IntegrationTests --no-restore -warnaserror
