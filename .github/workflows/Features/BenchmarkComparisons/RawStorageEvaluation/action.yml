name: Raw storage evaluation
description: Qualify real cache fixtures or one isolated generated raw-engine benchmark and retain original evidence.
inputs:
  mode:
    description: Closed correctness or benchmark mode
    required: true
  engine:
    description: Exact zonetree or tsavorite engine for the measured mode
    default: zonetree
runs:
  using: composite
  steps:
    - name: Check the selected evaluation mode
      shell: bash
      env:
        RAW_MODE: ${{ inputs.mode }}
        RAW_ENGINE: ${{ inputs.engine }}
      run: |
        case "$RAW_MODE" in correctness|benchmark) ;; *) exit 1 ;; esac
        case "$RAW_ENGINE" in zonetree|tsavorite) ;; *) exit 1 ;; esac
    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - name: Build real raw storage correctness fixtures
      if: inputs.mode == 'correctness'
      shell: bash
      run: |
        dotnet restore tests/KeyLoad.UnitTests/KeyLoad.UnitTests.csproj
        dotnet build tests/KeyLoad.UnitTests/KeyLoad.UnitTests.csproj --no-restore --configuration Release
    - name: Test real engine and report contracts
      if: inputs.mode == 'correctness'
      shell: bash
      env:
        KEYLOAD_RAW_STORAGE_ENGINE: zonetree
        NODE_V8_COVERAGE: ${{ github.workspace }}/artifacts/raw-storage-correctness/v8
      run: dotnet test --project tests/KeyLoad.UnitTests --no-build --no-restore --configuration Release --report-trx --treenode-filter '/*/*/RawStorage*/*' --results-directory artifacts/raw-storage-correctness/normal
    - name: Test the same contracts without hardware intrinsics
      if: inputs.mode == 'correctness'
      shell: bash
      env:
        KEYLOAD_RAW_STORAGE_ENGINE: zonetree
        DOTNET_EnableHWIntrinsic: 0
        NODE_V8_COVERAGE: ${{ github.workspace }}/artifacts/raw-storage-correctness/v8
      run: dotnet test --project tests/KeyLoad.UnitTests --no-build --no-restore --configuration Release --report-trx --treenode-filter '/*/*/RawStorage*/*' --results-directory artifacts/raw-storage-correctness/scalar
    - name: Build the actual generated benchmark host
      if: inputs.mode == 'benchmark'
      shell: bash
      run: |
        dotnet restore benchmarks/KeyLoad.Benchmarks/KeyLoad.Benchmarks.csproj
        dotnet build benchmarks/KeyLoad.Benchmarks/KeyLoad.Benchmarks.csproj --no-restore --configuration Release
    - name: Record execution identity and package bytes
      if: inputs.mode == 'benchmark'
      shell: bash
      env:
        KEYLOAD_RAW_STORAGE_ENGINE: ${{ inputs.engine }}
      run: |
        node scripts/Features/BenchmarkComparisons/raw-storage-evidence.mjs --mode=prepare --engine="$KEYLOAD_RAW_STORAGE_ENGINE" --directory="artifacts/raw-storage/$KEYLOAD_RAW_STORAGE_ENGINE"
        dotnet --info > "artifacts/raw-storage/$KEYLOAD_RAW_STORAGE_ENGINE/dotnet-info.txt"
    - name: Measure one real raw engine
      if: inputs.mode == 'benchmark'
      shell: bash
      env:
        KEYLOAD_RAW_STORAGE_ENGINE: ${{ inputs.engine }}
      run: |
        set -euo pipefail
        dotnet run --project benchmarks/KeyLoad.Benchmarks --no-build --no-restore --configuration Release -- --filter '*RawStorageBenchmarks*' --exporters fulljson csv --artifacts "artifacts/raw-storage/$KEYLOAD_RAW_STORAGE_ENGINE" 2>&1 | tee "artifacts/raw-storage/$KEYLOAD_RAW_STORAGE_ENGINE/stdout.txt"
    - name: Require every original measured cell
      if: inputs.mode == 'benchmark'
      shell: bash
      env:
        KEYLOAD_RAW_STORAGE_ENGINE: ${{ inputs.engine }}
      run: node scripts/Features/BenchmarkComparisons/raw-storage-evidence.mjs --mode=verify --engine="$KEYLOAD_RAW_STORAGE_ENGINE" --directory="artifacts/raw-storage/$KEYLOAD_RAW_STORAGE_ENGINE"
    - name: Save all original outputs and failures
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: raw-storage-${{ inputs.mode }}-${{ inputs.engine }}
        path: |
          artifacts/raw-storage/**
          artifacts/raw-storage-correctness/**
          artifacts/code-quality/**
        if-no-files-found: error
        retention-days: 90
