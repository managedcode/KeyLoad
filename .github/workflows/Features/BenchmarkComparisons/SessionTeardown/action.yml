name: Execution benchmark session shutdown
description: Retain original execution diagnostics after the fixture joins its client and disposes only its own Aspire resources.
inputs:
  artifact-name:
    description: Exact unique qualification artifact name
    required: true
runs:
  using: composite
  steps:
    - name: Save execution database logs and test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ runner.temp }}/keyload-cell-github/**
          ${{ runner.temp }}/keyload-session-github/**
          **/TestResults/**
          artifacts/code-quality/**
          artifacts/comparisons/sessions/failures/**
        if-no-files-found: error
        retention-days: 90
