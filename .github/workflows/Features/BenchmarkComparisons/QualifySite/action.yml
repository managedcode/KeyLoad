name: Qualify the current benchmark website
description: Preserve every original archive, browser, TUnit and coverage gate.
outputs:
  mode:
    value: ${{ steps.source.outputs.mode }}
  site_revision:
    value: ${{ steps.source.outputs.revision }}
  benchmark_mode:
    value: ${{ steps.source.outputs.benchmark_mode }}
runs:
  using: composite
  steps:
    - name: Create website test folders
      shell: bash
      run: |
        base="$GITHUB_WORKSPACE/artifacts/site-evidence"
        for directory in "$GITHUB_WORKSPACE/artifacts" "$base"; do
          if [[ -L "$directory" || ( -e "$directory" && ! -d "$directory" ) ]]; then
            printf '%s\n' 'Website evidence path must be a real directory.' >&2
            exit 1
          fi
        done
        mkdir -p "$base"
        {
          printf 'EVIDENCE_DIR=%s\nKEYLOAD_SITE_REPOSITORY=%s\n' "$base" "$GITHUB_WORKSPACE/w"
          printf 'KEYLOAD_SITE_COVERAGE=%s/js-coverage\n' "$base"
          printf 'KEYLOAD_SITE_ISOLATED_CAPTURE=%s/isolated-capture\nKEYLOAD_SITE_ISOLATED_ARCHIVE_RECEIPT=%s/isolated-capture/archive-receipt.json\nKEYLOAD_SITE_ISOLATED_AGGREGATE=%s/isolated-capture/input/aggregate\n' "$base" "$base" "$base"
        } >> "$GITHUB_ENV"
    - name: Download verified benchmark data
      id: source
      env:
        CONTROL_REVISION: ${{ github.workflow_sha }}
      shell: bash
      run: |
        mode=publish
        revision="$GITHUB_SHA"
        if [[ "$mode" == publish ]]; then
          [[ "$GITHUB_REF" == refs/heads/main ]]
          revision=$(timeout 120s gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
        fi
        [[ "$revision" =~ ^[a-f0-9]{40}$ && "$CONTROL_REVISION" =~ ^[a-f0-9]{40}$ ]]
        printf 'mode=%s\nrevision=%s\n' "$mode" "$revision" >> "$GITHUB_OUTPUT"
        printf 'KEYLOAD_SITE_SOURCE_REVISION=%s\n' "$revision" >> "$GITHUB_ENV"
        printf 'KEYLOAD_SITE_CONTROL_REVISION=%s\n' "$CONTROL_REVISION" >> "$GITHUB_ENV"
        isolated_args=("--input=$KEYLOAD_SITE_ISOLATED_CAPTURE" "--mode=$mode" "--site-revision=$revision" "--workflow-revision=$CONTROL_REVISION" "--optional=true")
        node control/scripts/Features/BenchmarkComparisons/site-isolated-github-cli.mjs capture "${isolated_args[@]}" > "$EVIDENCE_DIR/isolated-capture-envelope.json"
        jq -e '.ok == true' "$EVIDENCE_DIR/isolated-capture-envelope.json" > /dev/null
        isolated_proof="$KEYLOAD_SITE_ISOLATED_CAPTURE/metadata-proof.json"
        benchmark_mode=measured
        if jq -e '.result.state == "unavailable"' "$EVIDENCE_DIR/isolated-capture-envelope.json" > /dev/null; then
          benchmark_mode=none
        else
          printf 'KEYLOAD_SITE_ISOLATED_MEASURED_REVISION=%s\n' "$(jq -er '.source.measured' "$isolated_proof")" >> "$GITHUB_ENV"
          printf 'isolated_measured_revision=%s\n' "$(jq -er '.source.measured' "$isolated_proof")" >> "$GITHUB_OUTPUT"
        fi
        printf 'KEYLOAD_SITE_BENCHMARK_MODE=%s\n' "$benchmark_mode" >> "$GITHUB_ENV"
        printf 'benchmark_mode=%s\n' "$benchmark_mode" >> "$GITHUB_OUTPUT"
    - name: Download website source
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.source.outputs.revision }}
        # Keep the TUnit monitor socket below the Unix 103-byte path limit.
        path: w
        persist-credentials: false
    - name: Download current benchmark source
      if: steps.source.outputs.benchmark_mode == 'measured'
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.source.outputs.isolated_measured_revision }}
        path: measured-isolated
        persist-credentials: false
    - name: Check source revisions and browser tools
      shell: bash
      run: |
        [[ "$(git -C w rev-parse HEAD)" == "$KEYLOAD_SITE_SOURCE_REVISION" ]]
        if [[ "$KEYLOAD_SITE_BENCHMARK_MODE" == measured ]]; then
          [[ "$(git -C measured-isolated rev-parse HEAD)" == "$KEYLOAD_SITE_ISOLATED_MEASURED_REVISION" ]]
          test -f measured-isolated/.github/workflows/benchmarks.yml
          git -C measured-isolated rev-parse HEAD > "$EVIDENCE_DIR/isolated-measured-revision.txt"
          cp measured-isolated/.github/workflows/benchmarks.yml "$EVIDENCE_DIR/isolated-measured-producer.yml"
        else
          [[ "$KEYLOAD_SITE_BENCHMARK_MODE" == none ]]
        fi
        git -C w rev-parse HEAD > "$EVIDENCE_DIR/website-revision.txt"
        git -C control rev-parse HEAD > "$EVIDENCE_DIR/control-revision.txt"
        closure="scripts/Features/BenchmarkComparisons/site-isolated-dependencies.txt"
        cmp "control/$closure" "w/$closure"
        node control/scripts/Features/BenchmarkComparisons/session-source-closure.mjs --verify="control/$closure" > "$EVIDENCE_DIR/session-source-closure.json"
        LC_ALL=C sort -u "control/$closure" > "$EVIDENCE_DIR/isolated-dependencies.txt"
        cmp "control/$closure" "$EVIDENCE_DIR/isolated-dependencies.txt"
        sha256sum "w/$closure" >> "$EVIDENCE_DIR/executed-evidence-tools.sha256"
        while IFS= read -r relative; do
          [[ "$relative" =~ ^(scripts/Features/BenchmarkComparisons/[^/]+\.(mjs|ps1)|scripts/Features/CodeQuality/functional-coverage\.(shared|parse|execution-merge\.trx)\.ps1|site/Features/BenchmarkComparisons/[^/]+\.mjs|site/scripts/build\.mjs)$ ]]
          for root in control w; do
            [[ -f "$root/$relative" && ! -L "$root/$relative" ]]
            [[ "$(realpath -e "$root/$relative")" == "$GITHUB_WORKSPACE/$root/$relative" ]]
          done
          cmp "control/$relative" "w/$relative"
          sha256sum "w/$relative" >> "$EVIDENCE_DIR/executed-isolated-dependencies.sha256"
        done < "control/$closure"
        for action in BuildIsolatedSite QualifySite DeploySite; do
          for file in AGENTS.md action.yml; do
            relative=".github/workflows/Features/BenchmarkComparisons/$action/$file"
            cmp "control/$relative" "w/$relative"
            sha256sum "w/$relative" >> "$EVIDENCE_DIR/executed-evidence-tools.sha256"
          done
        done
        node --version > "$EVIDENCE_DIR/node-version.txt"
        chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
        test -n "$chrome" && test -x "$chrome"
        "$chrome" --version > "$EVIDENCE_DIR/browser-version.txt"
        printf 'KEYLOAD_SITE_BROWSER=%s\n' "$chrome" >> "$GITHUB_ENV"
        mkdir -p "$KEYLOAD_SITE_COVERAGE/node"
        cd w || exit
        git ls-files -z | xargs -0 sha256sum > "$EVIDENCE_DIR/source.sha256"
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: w/global.json
    - name: Build and test code analyzers
      id: analyzers
      working-directory: w
      shell: bash
      run: |
        dotnet --info > "$EVIDENCE_DIR/dotnet-info.txt"
        pwsh --version > "$EVIDENCE_DIR/powershell-version.txt"
        dotnet restore KeyLoad.slnx
        dotnet build build/KeyLoad.AppHost/KeyLoad.AppHost.csproj --no-restore -warnaserror
        dotnet build tests/KeyLoad.AnalyzerTests/KeyLoad.AnalyzerTests.csproj --no-restore -warnaserror
        mkdir -p "$EVIDENCE_DIR/analyzer-coverage"
        cp scripts/Features/CodeQuality/site-analyzer-coverage.settings.xml "$EVIDENCE_DIR/analyzer-coverage/coverage.config.xml"
        pwsh -NoProfile -File scripts/Features/CodeQuality/site-analyzer-coverage.ps1 -Mode Prepare -Repository "$KEYLOAD_SITE_REPOSITORY" -Contract "$KEYLOAD_SITE_REPOSITORY/scripts/Features/CodeQuality/site-analyzer-coverage.contract.json" -EvidenceRoot "$EVIDENCE_DIR/analyzer-coverage"
        node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=analyzers --KeyLoadTests:ReportTrx=true "--KeyLoadTests:ResultsDirectory=$EVIDENCE_DIR/analyzer-tests" "--KeyLoadTests:CoverageSettings=$EVIDENCE_DIR/analyzer-coverage/coverage.config.xml" "--KeyLoadTests:CoverageOutput=$EVIDENCE_DIR/analyzer-coverage/coverage.cobertura.xml"
    - name: Check analyzer test coverage
      if: (success() || failure()) && steps.analyzers.outcome != 'skipped'
      working-directory: w
      shell: pwsh
      run: ./scripts/Features/CodeQuality/site-analyzer-coverage.ps1 -Mode Verify -Repository "$env:KEYLOAD_SITE_REPOSITORY" -Contract "$env:KEYLOAD_SITE_REPOSITORY/scripts/Features/CodeQuality/site-analyzer-coverage.contract.json" -EvidenceRoot "$env:EVIDENCE_DIR/analyzer-coverage" -CoverageReport "$env:EVIDENCE_DIR/analyzer-coverage/coverage.cobertura.xml"
    - name: Build website tests
      working-directory: w
      shell: bash
      run: |
        dotnet restore tests/KeyLoad.WebsiteTests/KeyLoad.WebsiteTests.csproj
        dotnet build tests/KeyLoad.WebsiteTests/KeyLoad.WebsiteTests.csproj --no-restore -warnaserror
    - name: Check website test formatting and repository rules
      working-directory: w
      shell: bash
      run: |
        dotnet format analyzers/KeyLoad.Analyzers/KeyLoad.Analyzers.csproj --verify-no-changes --no-restore --severity warn --verbosity minimal > "$EVIDENCE_DIR/format-analyzers.txt" 2>&1
        dotnet format tests/KeyLoad.AnalyzerTests/KeyLoad.AnalyzerTests.csproj --verify-no-changes --no-restore --severity warn --verbosity minimal > "$EVIDENCE_DIR/format-analyzer-tests.txt" 2>&1
        dotnet format tests/KeyLoad.WebsiteTests/KeyLoad.WebsiteTests.csproj --verify-no-changes --no-restore --severity warn --verbosity minimal > "$EVIDENCE_DIR/format-site-tests.txt" 2>&1
        node scripts/Features/RepositoryGovernance/verify.mjs
    - name: Run all website tests
      working-directory: w
      shell: bash
      env:
        NODE_V8_COVERAGE: ${{ github.workspace }}/artifacts/site-evidence/js-coverage/node
      run: |
        # Bound the cases waiting for the existing two heavy child slots.
        site_args=(--KeyLoadTests:Suite=website --KeyLoadTests:Execution:MaximumParallelTests=8 --KeyLoadTests:TimeoutMinutes=120 --KeyLoadTests:ReportTrx=true "--KeyLoadTests:ResultsDirectory=$EVIDENCE_DIR/site-tests")
        if [[ "$KEYLOAD_SITE_BENCHMARK_MODE" == none ]]; then
          site_args+=('--KeyLoadTests:Filter=/*/*/SiteContent*/*')
        else
          [[ "$KEYLOAD_SITE_BENCHMARK_MODE" == measured ]]
        fi
        node scripts/Features/TestInfrastructure/run-tests.mjs "${site_args[@]}"
    - name: Check every required test passed
      shell: pwsh
      run: |
        $receipts = foreach ($suite in @('analyzer-tests', 'site-tests')) {
          $files = @(Get-ChildItem -LiteralPath "$env:EVIDENCE_DIR/$suite" -Filter '*.trx' -File)
          if ($files.Count -ne 1) { throw "Expected exactly one $suite TRX receipt" }
          [xml]$document = Get-Content -LiteralPath $files[0].FullName -Raw
          $counts = $document.TestRun.ResultSummary.Counters
          if ($null -eq $counts -or [int]$counts.total -le 0 -or
              [int]$counts.executed -ne [int]$counts.total -or
              [int]$counts.passed -ne [int]$counts.total) {
            throw "Incomplete or failing $suite qualification; skipped tests cannot pass"
          }
          [ordered]@{ suite = $suite; total = [int]$counts.total; executed = [int]$counts.executed; passed = [int]$counts.passed; sha256 = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
        }
        ConvertTo-Json -InputObject @($receipts) -Depth 4 | Set-Content -LiteralPath "$env:EVIDENCE_DIR/test-receipts.json" -Encoding utf8NoBOM
    - name: Build website from verified results
      uses: ./control/.github/workflows/Features/BenchmarkComparisons/BuildIsolatedSite
    - name: Upload website for GitHub Pages
      if: success() && steps.source.outputs.mode == 'publish'
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site
        include-hidden-files: true
    - name: Save website test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: site-qualification-${{ steps.source.outputs.revision }}-${{ github.run_attempt }}
        path: |
          _site
          artifacts/site-evidence
          w/artifacts/code-quality/KeyLoad.WebsiteTests
          w/artifacts/code-quality/KeyLoad.Analyzers
          w/artifacts/code-quality/KeyLoad.AnalyzerTests
          w/tests/KeyLoad.AnalyzerTests/bin/Debug/net10.0/KeyLoad.Analyzers.dll
          w/tests/KeyLoad.AnalyzerTests/bin/Debug/net10.0/KeyLoad.Analyzers.pdb
