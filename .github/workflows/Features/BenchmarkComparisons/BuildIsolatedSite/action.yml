name: Build the qualified current comparison website
description: Preserve original complete-cohort authority through the bounded final Pages build.
runs:
  using: composite
  steps:
    - name: Build website and record source revisions
      working-directory: ${{ env.KEYLOAD_SITE_REPOSITORY }}
      shell: bash
      run: |
        set -euo pipefail
        jq -e '.passed == true' "$EVIDENCE_DIR/analyzer-coverage/report.json"
        jq -e '.passed == true' "$KEYLOAD_SITE_COVERAGE/report.json"
        [[ "$KEYLOAD_SITE_BENCHMARK_MODE" == measured || "$KEYLOAD_SITE_BENCHMARK_MODE" == none ]]
        jq -e --arg mode "$KEYLOAD_SITE_BENCHMARK_MODE" --arg revision "$KEYLOAD_SITE_SOURCE_REVISION" '.benchmarkMode == $mode and .sourceRevision == $revision' "$KEYLOAD_SITE_COVERAGE/report.json" > /dev/null
        if [[ "$KEYLOAD_SITE_BENCHMARK_MODE" == none ]]; then
          availability="$KEYLOAD_SITE_ISOLATED_CAPTURE/metadata-proof.json"
          [[ -f "$availability" && ! -L "$availability" ]]
          jq -e '.state == "unavailable"' "$availability" > /dev/null
          availability_hash=$(sha256sum "$availability" | cut -d' ' -f1)
          timeout 300s node site/scripts/build.mjs --benchmarks=none --output="$GITHUB_WORKSPACE/_site" --site-revision="$KEYLOAD_SITE_SOURCE_REVISION" > "$EVIDENCE_DIR/final-builder.json"
          jq -e '.mode == "none" and .benchmarkSource == "none"' "$EVIDENCE_DIR/final-builder.json" > /dev/null
          [[ ! -e "$GITHUB_WORKSPACE/_site/data" && ! -L "$GITHUB_WORKSPACE/_site/data" ]]
          [[ "$(sha256sum "$availability" | cut -d' ' -f1)" == "$availability_hash" ]]
          timeout 120s gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$EVIDENCE_DIR/qualification-jobs-pages.json"
          job_url=$(jq -er '[.[].jobs[] | select(.name == "Check website")] | select(length == 1) | .[0].html_url' "$EVIDENCE_DIR/qualification-jobs-pages.json")
          native_hash=$(sha256sum "$EVIDENCE_DIR/analyzer-coverage/report.json" | cut -d' ' -f1)
          site_hash=$(sha256sum "$KEYLOAD_SITE_COVERAGE/report.json" | cut -d' ' -f1)
          mkdir "$GITHUB_WORKSPACE/_site/data"
          jq -n --slurpfile tests "$EVIDENCE_DIR/test-receipts.json" --arg website "$KEYLOAD_SITE_SOURCE_REVISION" --arg control "$KEYLOAD_SITE_CONTROL_REVISION" --arg run_url "https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --arg job_url "$job_url" --arg native_hash "$native_hash" --arg site_hash "$site_hash" --arg availability_hash "$availability_hash" '{schemaVersion:3,source:{website:$website,control:$control,measured:null},qualification:{scope:"content",runUrl:$run_url,jobUrl:$job_url,nativeReportSha256:$native_hash,siteReportSha256:$site_hash,availabilitySha256:$availability_hash,tests:$tests[0]},benchmarks:null}' > "$GITHUB_WORKSPACE/_site/data/publication.json"
          exit 0
        fi
        readonly isolated_receipt_limit=4194304
        readonly isolated_snapshot="$EVIDENCE_DIR/final-isolated-archive-receipt.json"
        [[ "$KEYLOAD_SITE_ISOLATED_AGGREGATE" == "$KEYLOAD_SITE_ISOLATED_CAPTURE/input/aggregate" ]]
        snapshot_receipt() {
          local source="$1" target="$2" maximum="$3"
          [[ -f "$source" && ! -L "$source" ]]
          local bytes
          bytes=$(stat -c %s "$source")
          [[ "$bytes" =~ ^[0-9]+$ && "$bytes" -gt 0 && "$bytes" -le "$maximum" ]]
          [[ ! -e "$target" && ! -L "$target" ]]
          (set -o noclobber; cat "$source" > "$target")
          chmod 400 "$target"
          cmp "$source" "$target"
        }
        snapshot_receipt "$KEYLOAD_SITE_ISOLATED_ARCHIVE_RECEIPT" "$isolated_snapshot" "$isolated_receipt_limit"
        isolated_hash=$(sha256sum "$isolated_snapshot" | cut -d' ' -f1)
        readonly isolated_hash
        verify_authority() {
          cmp "$KEYLOAD_SITE_ISOLATED_ARCHIVE_RECEIPT" "$isolated_snapshot"
          [[ "$(sha256sum "$isolated_snapshot" | cut -d' ' -f1)" == "$isolated_hash" ]]
        }
        verify_isolated_inputs() {
          local phase="$1"
          verify_authority
          timeout 300s node scripts/Features/BenchmarkComparisons/site-isolated-github-cli.mjs verify-inputs --input="$KEYLOAD_SITE_ISOLATED_CAPTURE" --receipt="$isolated_snapshot" > "$EVIDENCE_DIR/isolated-final-$phase.json"
          jq -e --slurpfile receipt "$isolated_snapshot" '.ok == true and .result.workers == ($receipt[0].workers | length) and .result.files == ($receipt[0].inputFiles | length)' "$EVIDENCE_DIR/isolated-final-$phase.json" > /dev/null
          verify_authority
        }
        verify_isolated_inputs before
        evidence_url=$(jq -er '.run.url' "$isolated_snapshot")
        timeout 300s node site/scripts/build.mjs --isolated="$KEYLOAD_SITE_ISOLATED_AGGREGATE" --output="$GITHUB_WORKSPACE/_site" --revision="$KEYLOAD_SITE_ISOLATED_MEASURED_REVISION" --evidence-url="$evidence_url" --site-revision="$KEYLOAD_SITE_SOURCE_REVISION" > "$EVIDENCE_DIR/final-builder.json"
        [[ -f "$GITHUB_WORKSPACE/_site/data/isolated/aggregate.json" && ! -L "$GITHUB_WORKSPACE/_site/data/isolated/aggregate.json" ]]
        cmp "$KEYLOAD_SITE_ISOLATED_AGGREGATE/aggregate.json" "$GITHUB_WORKSPACE/_site/data/isolated/aggregate.json"
        verify_isolated_inputs after
        timeout 120s gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$EVIDENCE_DIR/qualification-jobs-pages.json"
        job_url=$(jq -er '[.[].jobs[] | select(.name == "Check website")] | select(length == 1) | .[0].html_url' "$EVIDENCE_DIR/qualification-jobs-pages.json")
        native_hash=$(sha256sum "$EVIDENCE_DIR/analyzer-coverage/report.json" | cut -d' ' -f1)
        site_hash=$(sha256sum "$KEYLOAD_SITE_COVERAGE/report.json" | cut -d' ' -f1)
        jq -n --slurpfile tests "$EVIDENCE_DIR/test-receipts.json" --slurpfile isolated "$isolated_snapshot" --arg run_url "https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --arg job_url "$job_url" --arg native_hash "$native_hash" --arg site_hash "$site_hash" '{schemaVersion:2,source:$isolated[0].source,qualification:{runUrl:$run_url,jobUrl:$job_url,nativeReportSha256:$native_hash,siteReportSha256:$site_hash,tests:$tests[0]},isolated:$isolated[0]}' > "$GITHUB_WORKSPACE/_site/data/publication.json"
        verify_authority
