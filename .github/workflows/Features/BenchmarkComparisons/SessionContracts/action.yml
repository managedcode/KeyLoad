name: Execution benchmark preparation contracts
description: Run the complete execution preparation checks once before database sessions.
runs:
  using: composite
  steps:
    - name: Check execution KurrentDB discovery settings
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/IsolatedKurrentDiscoverySettingsTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/kurrent-discovery
    - name: Check exact OpenSearch vector query contract
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/OpenSearchVectorQueryTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/opensearch-query
    - name: Check exact OpenSearch vector response contract
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/OpenSearchVectorResponseTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/opensearch-response
    - name: Check TimescaleDB Docker image and startup tools
      env:
        KEYLOAD_TIMESERIES_IMAGE_FACTS_DIRECTORY: ${{ runner.temp }}/keyload-timeseries-image-facts
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/TimeSeriesIntensivePinnedImageTests/*' --KeyLoadTests:ResultsDirectory=TestResults/timeseries-image
    - name: Save TimescaleDB image checks
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: timeseries-execution-pinned-image-facts
        path: |
          ${{ runner.temp }}/keyload-timeseries-image-facts/**
          **/TestResults/**
          artifacts/code-quality/**
        if-no-files-found: error
        retention-days: 90
    - name: Test database cluster resource models
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/Isolated*Resource*/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/resource-models
    - name: Test execution session shutdown and original failure retention
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/(IsolatedTeardownSuccessTests|IsolatedTeardownFailureTests|IsolatedLogCaptureConcurrentDisposeTests)/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/session-shutdown --KeyLoadTests:ReportTrx=true
    - name: Test MongoDB readiness configuration
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/MongoReadinessResourceTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/mongo-resource
    - name: Test MongoDB node identity
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/MongoReadinessIdentityTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/mongo-identity
    - name: Test MongoDB startup failure handling
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/MongoReadinessTaskFailureTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/mongo-task-failure
    - name: Test KurrentDB storage failure handling
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/IsolatedKurrentVolumeChecksFailureTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/kurrent-volume-failure
    - name: Test KeyLoad request admission
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/IsolatedKeyLoadAdmissionTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/keyload-admission
    - name: Test bounded database log buffers
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/ComparisonResourceLogBufferTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/log-buffer
    - name: Test live benchmark progress capture
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/ComparisonProgress*/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/live-progress
    - name: Test shared execution session entry and safe failures
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/(ComparisonHostStartupTests|ComparisonHostCleanupTests|BenchmarkSessionParserTests)/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/live-entry
    - name: Test shared session live acknowledgement and cancellation counters
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/BenchmarkSessionProgressTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/live-counters
    - name: Test document resource budgets and current execution topology
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/(DocumentResourceBudgetTests|TopologyAdmissionTests)/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/document-admission --KeyLoadTests:ReportTrx=true
    - name: Test controlled execution shared-session operations and cancellation
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/DocumentComparisonTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/document-execution --KeyLoadTests:ReportTrx=true
    - name: Test KeyLoad replay admission
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/IsolatedKeyLoadReplayAdmissionTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/replay-admission
    - name: Test Redis replica error reporting
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/RedisReplicaDiagnosticTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/redis-diagnostics
    - name: Test MongoDB startup error reporting
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/MongoBootstrapDiagnosticTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/mongo-diagnostics
    - name: Test KurrentDB cleanup error reporting
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/KurrentCleanupDiagnosticTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/kurrent-diagnostics
    - name: Test KurrentDB stream ownership
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/KurrentStreamOwnershipTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/kurrent-stream-ownership
    - name: Test database replay logs
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/ComparisonReplayDiagnosticLogTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/replay-log
    - name: Test database replay log retention
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/ComparisonReplayDiagnosticRetentionTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/replay-retention
    - name: Test time-series workload correctness
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/TimeSeriesWorkloadTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/timeseries-workload
    - name: Check published time-series package version
      shell: bash
      run: node scripts/Features/TestInfrastructure/run-tests.mjs --KeyLoadTests:Suite=comparison '--KeyLoadTests:Filter=/*/*/TimeSeriesPackageVersionTests/*' --KeyLoadTests:ResultsDirectory=TestResults/comparison-runtime/timeseries-package
