name: Isolated native comparison setup
description: Authenticate the current job and import exact qualified native images into its own Linux runner.
inputs:
  bundle-artifact-id:
    description: Exact same-run immutable image bundle artifact ID
    required: true
runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - name: Check Docker and kernel settings
      shell: bash
      run: |
        docker version
        sudo sysctl -w vm.max_map_count=262144
    - name: Verify this GitHub job
      shell: bash
      run: node scripts/Features/BenchmarkComparisons/isolated-github-job.mjs
    - name: Download benchmark Docker images
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        artifact-ids: ${{ inputs.bundle-artifact-id }}
        path: ${{ runner.temp }}/keyload-image-bundle
    - name: Load and verify Docker images
      id: images
      shell: bash
      run: node scripts/Features/BenchmarkComparisons/import-images.mjs --bundle="$RUNNER_TEMP/keyload-image-bundle"
    - name: Configure imported Docker images
      env:
        KEYLOAD_SERVER_IMAGE: ${{ steps.images.outputs.server-image }}
        KEYLOAD_RUNNER_IMAGE: ${{ steps.images.outputs.load-generator-image }}
      shell: bash
      run: |
        test -n "$KEYLOAD_SERVER_IMAGE" && test -n "$KEYLOAD_RUNNER_IMAGE"
        printf 'KeyLoad__ContainerImages__Server=%s\nBenchmarks__ContainerImages__LoadGenerator=%s\nKEYLOAD_IMAGE_RECEIPT=%s\n' "$KEYLOAD_SERVER_IMAGE" "$KEYLOAD_RUNNER_IMAGE" "$RUNNER_TEMP/keyload-images/image-receipt.json" >> "$GITHUB_ENV"
