name: Execution benchmark session setup
description: Authenticate this job, import the exact compiled client and Aspire runtime, and pull the released KeyLoad image for KeyLoad cells.
inputs:
  runtime-artifact-id:
    description: Same-run immutable compiled runner bundle
    required: true
  keyload-image:
    description: Release-published KeyLoad server image pinned to the digest resolved once for this run; empty for other databases
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Read the pinned .NET SDK version
      id: dotnet-sdk
      shell: bash
      run: jq -er '"version=" + .sdk.version' global.json >> "$GITHUB_OUTPUT"
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}
    - name: Check Docker and kernel settings
      shell: bash
      run: |
        docker version
        sudo sysctl -w vm.max_map_count=262144
    - name: Verify this GitHub session job
      shell: bash
      run: node scripts/Features/BenchmarkComparisons/session-github-job.mjs
    - name: Download compiled benchmark runtime
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ inputs.runtime-artifact-id }}
        path: ${{ runner.temp }}/keyload-compiled-runtime
    - name: Import and verify compiled benchmark runtime
      shell: bash
      run: node scripts/Features/BenchmarkComparisons/compiled-test-bundle.mjs --import="$RUNNER_TEMP/keyload-compiled-runtime"
    - name: Pull the released KeyLoad server image
      if: inputs.keyload-image != ''
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ github.token }}
        KEYLOAD_IMAGE: ${{ inputs.keyload-image }}
      run: |
        [[ "$KEYLOAD_IMAGE" =~ ^ghcr\.io/managedcode/keyload:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}@sha256:[0-9a-f]{64}$ ]]
        printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        docker pull "$KEYLOAD_IMAGE"
        docker logout ghcr.io
