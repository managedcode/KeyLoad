name: Execution benchmark session setup
description: Authenticate this job and import the exact compiled execution server, client and Aspire runtime.
inputs:
  runtime-artifact-id:
    description: Same-run immutable compiled runner bundle
    required: true
runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - name: Check Docker and kernel settings
      shell: bash
      run: |
        docker version
        sudo sysctl -w vm.max_map_count=262144
    - name: Verify this GitHub session job
      shell: bash
      run: node scripts/Features/BenchmarkComparisons/session-github-job.mjs
    - name: Download compiled benchmark runtime
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        artifact-ids: ${{ inputs.runtime-artifact-id }}
        path: ${{ runner.temp }}/keyload-compiled-runtime
    - name: Import and verify compiled benchmark runtime
      shell: bash
      run: node scripts/Features/BenchmarkComparisons/compiled-test-bundle.mjs --import="$RUNNER_TEMP/keyload-compiled-runtime"
