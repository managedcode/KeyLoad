name: TimeSeries native pinned image feasibility
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/timeseries-image.yml
      - tests/KeyLoad.ComparisonTests/Features/BenchmarkComparisons/TimeSeries/Intensive/TimeSeriesIntensivePinnedImage*
      - Directory.Packages.props
      - Directory.Build.props
      - global.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keyload-timeseries-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  timeseries-image-facts:
    if: github.repository == 'managedcode/KeyLoad' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYLOAD_TIMESERIES_IMAGE_FACTS_DIRECTORY: ${{ runner.temp }}/keyload-timeseries-image-facts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Require exact own-main source and actual Docker runtime
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = 'managedcode/KeyLoad'
          test "$GITHUB_REF" = 'refs/heads/main'
          docker version
      - run: dotnet restore KeyLoad.slnx
      - run: dotnet build tests/KeyLoad.ComparisonTests --no-restore --configuration Release
      - name: Observe the actual pinned Timescale image and native bootstrap primitives
        run: dotnet test --project tests/KeyLoad.ComparisonTests --no-build --no-restore --configuration Release --treenode-filter '/*/*/TimeSeriesIntensivePinnedImageTests/*' --results-directory TestResults/timeseries-image
      - name: Retain actual native image facts and feasibility qualification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: timeseries-native-pinned-image-facts
          path: |
            ${{ runner.temp }}/keyload-timeseries-image-facts/**
            **/TestResults/**
            artifacts/code-quality/**
          if-no-files-found: error
          retention-days: 90
