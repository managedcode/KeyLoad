name: Website
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/KeyLoad.SiteTests/**'
      - 'scripts/Features/BenchmarkComparisons/site-*'
      - 'scripts/Features/BenchmarkComparisons/composite-site-*'
      - '.github/workflows/website.yml'
      - '.github/workflows/Features/BenchmarkComparisons/QualifySite/**'
      - '.github/workflows/Features/BenchmarkComparisons/BuildIsolatedSite/**'
      - '.github/workflows/Features/BenchmarkComparisons/DeploySite/**'
      - 'scripts/Features/TestInfrastructure/run-tests.mjs'
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
  workflow_dispatch:
    inputs:
      benchmark_run_id:
        description: Benchmark run to await (optional)
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  qualify:
    name: Check website
    concurrency:
      group: keyload-site-qualification
      cancel-in-progress: false
    if: >-
      github.repository == 'managedcode/KeyLoad' && github.event.repository.id == 477801965 &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read, actions: read}
    outputs:
      mode: ${{ steps.qualification.outputs.mode }}
      site_revision: ${{ steps.qualification.outputs.site_revision }}
      benchmark_mode: ${{ steps.qualification.outputs.benchmark_mode }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Await the triggering benchmark run
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_run_id != ''
        timeout-minutes: 5
        env:
          BENCHMARK_RUN_ID: ${{ inputs.benchmark_run_id }}
        run: |
          [[ "$BENCHMARK_RUN_ID" =~ ^[1-9][0-9]*$ && ${#BENCHMARK_RUN_ID} -le 20 ]]
          benchmark_deadline=$((SECONDS + 270))
          benchmark_poll=0
          while ((SECONDS < benchmark_deadline)); do
            benchmark_remaining=$((benchmark_deadline - SECONDS))
            ((benchmark_remaining > 0)) || break
            benchmark_request_timeout=$((benchmark_remaining < 10 ? benchmark_remaining : 10))
            if ! benchmark_metadata=$(timeout "${benchmark_request_timeout}s" gh api "repos/$GH_REPO/actions/runs/$BENCHMARK_RUN_ID"); then
              printf '%s\n' 'Unable to read the triggering benchmark run within the bounded request.' >&2
              exit 1
            fi
            jq -e --arg run "$BENCHMARK_RUN_ID" '
              (.id | tostring) == $run and
              .repository.id == 477801965 and .repository.full_name == "managedcode/KeyLoad" and
              .head_repository.id == 477801965 and .head_repository.full_name == "managedcode/KeyLoad" and
              .head_branch == "main" and .name == "Benchmarks" and
              .path == ".github/workflows/benchmarks.yml" and
              (.event == "push" or .event == "workflow_dispatch") and
              (.head_sha | test("^[a-f0-9]{40}$"))' <<< "$benchmark_metadata" > /dev/null
            if [[ "$(jq -r .status <<< "$benchmark_metadata")" == completed ]]; then
              jq -e '.conclusion == "success"' <<< "$benchmark_metadata" > /dev/null
              exit 0
            fi
            benchmark_poll=$((benchmark_poll + 1))
            printf 'Waiting for benchmark completion (poll %s).\n' "$benchmark_poll"
            benchmark_remaining=$((benchmark_deadline - SECONDS))
            ((benchmark_remaining > 0)) || break
            sleep "$((benchmark_remaining < 5 ? benchmark_remaining : 5))"
          done
          printf '%s\n' 'The triggering benchmark run did not complete within the bounded wait.' >&2
          exit 1
      - name: Download source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Run website checks
        id: qualification
        uses: ./control/.github/workflows/Features/BenchmarkComparisons/QualifySite
  deploy:
    name: Publish website
    concurrency:
      group: keyload-site-deployment
      cancel-in-progress: false
    needs: qualify
    if: ${{ always() && !cancelled() && needs.qualify.result == 'success' && needs.qualify.outputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {contents: read, actions: read, pages: write, id-token: write}
    environment: {name: github-pages, url: '${{ steps.publication.outputs.page_url }}'}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      QUALIFIED_REVISION: ${{ needs.qualify.outputs.site_revision }}
      CONTROL_REVISION: ${{ github.workflow_sha }}
      KEYLOAD_SITE_BENCHMARK_MODE: ${{ needs.qualify.outputs.benchmark_mode }}
    steps:
      - name: Download source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Publish website
        id: publication
        uses: ./control/.github/workflows/Features/BenchmarkComparisons/DeploySite
