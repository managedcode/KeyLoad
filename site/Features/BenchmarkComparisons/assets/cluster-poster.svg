<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1827 794" role="img" aria-labelledby="title description">
  <title id="title">KeyLoad Orleans RF3 cluster</title>
  <desc id="description">Conceptual Orleans cluster of three silos on Node A, Node B and Node C. Connected grain activations run inside each silo; node-local storage stays with each physical node. The canonical KeyLoad mark sits between the nodes. This illustration shows architecture, not live telemetry or replication timing.</desc>
  <defs>
    <linearGradient id="mark-gradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3d"/><stop offset="1" stop-color="#0d0e10"/></linearGradient>
    <linearGradient id="mark-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="mark-iris" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb08a"/><stop offset=".5" stop-color="#e3a6ff"/><stop offset="1" stop-color="#9fb4ff"/></linearGradient>
    <linearGradient id="glass-peach" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#fff" stop-opacity=".94"/><stop offset=".45" stop-color="#f1ded4" stop-opacity=".8"/><stop offset="1" stop-color="#dfcbc5" stop-opacity=".6"/></linearGradient>
    <linearGradient id="glass-lilac" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#fff" stop-opacity=".94"/><stop offset=".45" stop-color="#e9deed" stop-opacity=".8"/><stop offset="1" stop-color="#cfc6db" stop-opacity=".6"/></linearGradient>
    <linearGradient id="glass-iris" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#fff" stop-opacity=".94"/><stop offset=".45" stop-color="#e0e1ef" stop-opacity=".8"/><stop offset="1" stop-color="#c8cbdf" stop-opacity=".6"/></linearGradient>
    <linearGradient id="storage" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#444149"/><stop offset="1" stop-color="#242329"/></linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bfb4be" stop-opacity="0"/><stop offset=".5" stop-color="#bfb4be" stop-opacity=".65"/><stop offset="1" stop-color="#bfb4be" stop-opacity="0"/></linearGradient>
    <!-- Canonical vector geometry and colors from site/favicon.svg. -->
    <symbol id="keyload-mark" viewBox="0 0 40 40">
      <rect width="40" height="40" rx="10" fill="url(#mark-gradient)"/>
      <rect x=".5" y=".5" width="39" height="39" rx="9.5" fill="url(#mark-sheen)" stroke="#fff" stroke-opacity=".14"/>
      <rect x="10" y="9" width="5" height="6" rx="2" fill="#fff"/>
      <rect x="10" y="17" width="5" height="6" rx="2" fill="#fff"/>
      <rect x="10" y="25" width="5" height="6" rx="2" fill="url(#mark-iris)"/>
      <path d="M29 9.5 19.5 20 29 30.5" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="grains" viewBox="0 0 200 130">
      <g fill="none" stroke="#726778" stroke-width="1.8" stroke-linecap="round" stroke-opacity=".63">
        <path d="m34 33 63 29 65-32M34 33l13 66 50-37 62 37 3-69M47 99l112 0M97 62l0-43"/>
      </g>
      <g fill="#f7f5f3" stroke="#6e6475" stroke-width="1.8">
        <circle cx="34" cy="33" r="9"/><circle cx="162" cy="30" r="9"/>
        <circle cx="97" cy="62" r="14"/><circle cx="47" cy="99" r="9"/>
        <circle cx="159" cy="99" r="9"/><circle cx="97" cy="19" r="6"/>
      </g>
      <circle cx="97" cy="62" r="5" fill="#8c7d98"/>
    </symbol>
    <style>
      .heading{font:600 38px Arial,sans-serif;fill:#29272d;letter-spacing:-.6px}
      .node{font:600 29px Arial,sans-serif;fill:#36323b;letter-spacing:-.2px}
      .caption{font:24px Arial,sans-serif;fill:#68616d}
      .storage-label{font:21px Arial,sans-serif;fill:#f7f5f3}
      .eyebrow{font:600 15px Arial,sans-serif;fill:#817883;letter-spacing:2.7px}
    </style>
  </defs>
  <rect width="1827" height="794" fill="#f7f5f3"/>
  <text x="86" y="60" class="eyebrow">KEYLOAD / RF3</text>
  <text x="86" y="108" class="heading">Orleans cluster</text>
  <text x="1741" y="70" class="eyebrow" text-anchor="end">THREE PHYSICAL NODES</text>
  <path d="M86 134h1655" stroke="url(#rule)"/>
  <!-- Static undirected routes express cluster connectivity, not traffic. -->
  <g fill="none" stroke="#a69aaa" stroke-width="2" stroke-opacity=".65">
    <path d="M913.5 275 450 450M913.5 275 1377 450M450 450h927"/>
  </g>
  <!-- Silo C routes grains; the physical node retains its storage. -->
  <g>
    <ellipse cx="913.5" cy="454.14" rx="142.04000000000002" ry="21.386400000000002" fill="#3a333f" opacity=".055"/>
    <path d="M779.5 178a134.0 28.14 0 0 1 268 0v152a134.0 28.14 0 0 1 -268 0Z" fill="url(#glass-lilac)" stroke="#c0b4c5" stroke-opacity=".7" stroke-width="1.5"/>
    <ellipse cx="913.5" cy="178" rx="134.0" ry="28.14" fill="#fff" fill-opacity=".7" stroke="#bcb1c2" stroke-opacity=".6" stroke-width="1.5"/>
    <path d="M792.5 195v124" stroke="#fff" stroke-opacity=".88" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="913.5" cy="330" rx="134.0" ry="28.14" fill="none" stroke="#bcb1c2" stroke-opacity=".5" stroke-width="1.5"/>
    <text x="913.5" y="227" class="node" text-anchor="middle">Silo C / Node C</text>
    <use href="#grains" x="814.34" y="245" width="198.32" height="72"/>
    <path d="M779.5 345a134.0 28.14 0 0 1 268 0v68a134.0 28.14 0 0 1 -268 0Z" fill="url(#storage)"/>
    <ellipse cx="913.5" cy="345" rx="134.0" ry="28.14" fill="#57525e" stroke="#fff" stroke-opacity=".27"/>
    <path d="M795.5 409q118.0 42.21 236 0" fill="none" stroke="#fff" stroke-opacity=".13"/>
    <text x="913.5" y="387.15999999999997" class="storage-label" text-anchor="middle">Node-local storage</text>
  </g>
  <!-- Silo A routes grains; the physical node retains its storage. -->
  <g>
    <ellipse cx="450.0" cy="716.05" rx="217.3" ry="32.717999999999996" fill="#3a333f" opacity=".055"/>
    <path d="M245 368a205.0 43.05 0 0 1 410 0v209a205.0 43.05 0 0 1 -410 0Z" fill="url(#glass-peach)" stroke="#c0b4c5" stroke-opacity=".7" stroke-width="1.5"/>
    <ellipse cx="450.0" cy="368" rx="205.0" ry="43.05" fill="#fff" fill-opacity=".7" stroke="#bcb1c2" stroke-opacity=".6" stroke-width="1.5"/>
    <path d="M258 385v181" stroke="#fff" stroke-opacity=".88" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="450.0" cy="577" rx="205.0" ry="43.05" fill="none" stroke="#bcb1c2" stroke-opacity=".5" stroke-width="1.5"/>
    <text x="450.0" y="417" class="node" text-anchor="middle">Silo A / Node A</text>
    <use href="#grains" x="298.3" y="435" width="303.4" height="129"/>
    <path d="M245 592a205.0 43.05 0 0 1 410 0v68a205.0 43.05 0 0 1 -410 0Z" fill="url(#storage)"/>
    <ellipse cx="450.0" cy="592" rx="205.0" ry="43.05" fill="#57525e" stroke="#fff" stroke-opacity=".27"/>
    <path d="M261 656q189.0 64.57499999999999 378 0" fill="none" stroke="#fff" stroke-opacity=".13"/>
    <text x="450.0" y="634.16" class="storage-label" text-anchor="middle">Node-local storage</text>
  </g>
  <!-- Silo B routes grains; the physical node retains its storage. -->
  <g>
    <ellipse cx="1377.0" cy="716.05" rx="217.3" ry="32.717999999999996" fill="#3a333f" opacity=".055"/>
    <path d="M1172 368a205.0 43.05 0 0 1 410 0v209a205.0 43.05 0 0 1 -410 0Z" fill="url(#glass-iris)" stroke="#c0b4c5" stroke-opacity=".7" stroke-width="1.5"/>
    <ellipse cx="1377.0" cy="368" rx="205.0" ry="43.05" fill="#fff" fill-opacity=".7" stroke="#bcb1c2" stroke-opacity=".6" stroke-width="1.5"/>
    <path d="M1185 385v181" stroke="#fff" stroke-opacity=".88" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="1377.0" cy="577" rx="205.0" ry="43.05" fill="none" stroke="#bcb1c2" stroke-opacity=".5" stroke-width="1.5"/>
    <text x="1377.0" y="417" class="node" text-anchor="middle">Silo B / Node B</text>
    <use href="#grains" x="1225.3" y="435" width="303.4" height="129"/>
    <path d="M1172 592a205.0 43.05 0 0 1 410 0v68a205.0 43.05 0 0 1 -410 0Z" fill="url(#storage)"/>
    <ellipse cx="1377.0" cy="592" rx="205.0" ry="43.05" fill="#57525e" stroke="#fff" stroke-opacity=".27"/>
    <path d="M1188 656q189.0 64.57499999999999 378 0" fill="none" stroke="#fff" stroke-opacity=".13"/>
    <text x="1377.0" y="634.16" class="storage-label" text-anchor="middle">Node-local storage</text>
  </g>
  <use href="#keyload-mark" x="846.5" y="455" width="134" height="134"/>
  <text x="913.5" y="633" class="caption" text-anchor="middle">Grain activations</text>
  <path d="M86 717h1655" stroke="url(#rule)"/>
  <text x="86" y="755" class="eyebrow">ORLEANS EXECUTION · NODE-LOCAL OWNERSHIP</text>
  <text x="1741" y="755" class="eyebrow" text-anchor="end">CONCEPTUAL ARCHITECTURE</text>
</svg>
