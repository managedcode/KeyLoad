<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">Conceptual KeyLoad RF3 architecture</title>
  <desc id="description">One stable logical atomic partition is shown separately from three physical hosts, each with node-local storage.</desc>
  <defs>
    <linearGradient id="ground" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f3f6fc"/><stop offset="1" stop-color="#e3e9f4"/></linearGradient>
    <linearGradient id="host" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f1f4fa"/></linearGradient>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#3d7bf7"/><stop offset="1" stop-color="#4b3bd1"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="14"/><feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="820" fill="url(#ground)"/>
  <path d="M0 600 600 340l600 260v220H0z" fill="#dde4f0"/>
  <path d="m108 581 492-214 492 214-492 214z" fill="#ccd6e8" opacity=".6"/>
  <g fill="none" stroke="#8a9bc0" stroke-width="2.5" stroke-dasharray="8 11" stroke-linecap="round">
    <path d="M600 213 244 370M600 213 600 370M600 213 956 370"/>
    <path d="M244 532 600 685M600 532 600 685M956 532 600 685"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="406" y="70" width="388" height="155" rx="22" fill="url(#brand)"/>
    <rect x="432" y="96" width="44" height="44" rx="12" fill="#ffffff"/>
    <rect x="443" y="104" width="7" height="8" rx="2.5" fill="#3d6ff2"/><rect x="443" y="114" width="7" height="8" rx="2.5" fill="#3d6ff2"/><rect x="443" y="124" width="7" height="8" rx="2.5" fill="#3d6ff2"/>
    <path d="M467 104.5 455 118l12 13.5" fill="none" stroke="#3d6ff2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="496" y="116" fill="#dfe7ff" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="2">LOGICAL IDENTITY</text>
