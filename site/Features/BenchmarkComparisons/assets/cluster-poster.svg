<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Conceptual KeyLoad RF3 architecture</title>
  <desc id="description">One stable logical atomic partition is shown separately from three physical hosts, each with node-local storage.</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#1b1d21"/><stop offset="1" stop-color="#0c0d10"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c6f24e" stop-opacity=".45"/><stop offset="1" stop-color="#c6f24e" stop-opacity="0"/></radialGradient>
    <linearGradient id="host" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#34373e"/><stop offset="1" stop-color="#1c1e23"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#sky)"/>
  <ellipse cx="600" cy="500" rx="520" ry="70" fill="#17191d"/>
  <ellipse cx="600" cy="140" rx="160" ry="160" fill="url(#glow)"/>
  <g stroke="#a4d82f" stroke-width="3" stroke-linecap="round" opacity=".85">
    <path d="M600 160 300 330M600 160 600 330M600 160 900 330"/>
  </g>
  <path d="m600 112 34 48-34 48-34-48z" fill="#c6f24e"/>
  <path d="m600 112 34 48h-68z" fill="#e6fca6"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">
    <g transform="translate(210 330)">
      <rect width="180" height="160" rx="18" fill="url(#host)" stroke="url(#edge)" stroke-width="2"/>
      <rect x="28" y="44" width="56" height="34" rx="8" fill="#c6f24e"/><rect x="96" y="44" width="56" height="34" rx="8" fill="#c9b4ff"/>
      <rect x="40" y="108" width="100" height="6" rx="3" fill="#ffb08a"/>
      <text x="90" y="142" fill="#a1a1a6" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">HOST 01</text>
    </g>
    <g transform="translate(510 330)">
      <rect width="180" height="160" rx="18" fill="url(#host)" stroke="url(#edge)" stroke-width="2"/>
      <rect x="28" y="44" width="56" height="34" rx="8" fill="#c6f24e"/><rect x="96" y="44" width="56" height="34" rx="8" fill="#c9b4ff"/>
      <rect x="40" y="108" width="100" height="6" rx="3" fill="#ffb08a"/>
      <text x="90" y="142" fill="#a1a1a6" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">HOST 02</text>
    </g>
    <g transform="translate(810 330)">
      <rect width="180" height="160" rx="18" fill="url(#host)" stroke="url(#edge)" stroke-width="2"/>
      <rect x="28" y="44" width="56" height="34" rx="8" fill="#c6f24e"/><rect x="96" y="44" width="56" height="34" rx="8" fill="#c9b4ff"/>
      <rect x="40" y="108" width="100" height="6" rx="3" fill="#ffb08a"/>
      <text x="90" y="142" fill="#a1a1a6" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">HOST 03</text>
    </g>
    <text x="600" y="64" fill="#f5f5f7" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="2">LOGICAL PARTITION A-17</text>
    <text x="600" y="560" fill="#6e6e73" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">PLACEMENT CAN MOVE · LOGICAL IDENTITY STAYS</text>
  </g>
</svg>
