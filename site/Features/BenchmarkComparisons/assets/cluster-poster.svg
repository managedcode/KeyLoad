      <circle cx="30" cy="30" r="7" fill="#0ca30c"/><text x="46" y="35" fill="#334155" font-size="13" font-weight="700" letter-spacing="2">PHYSICAL HOST 03</text>
      <text x="22" y="82" fill="#0f172a" font-size="18" font-weight="700">Node-local PartitionHost</text>
      <rect x="22" y="105" width="272" height="80" rx="12" fill="#eef3ff"/>
      <rect x="42" y="125" width="34" height="16" rx="5" fill="#3d6ff2"/><rect x="42" y="149" width="34" height="16" rx="5" fill="#2443c4"/>
      <text x="94" y="139" fill="#16245f" font-size="14" font-weight="600">Store · journal</text><text x="94" y="163" fill="#16245f" font-size="14" font-weight="600">Lock · apply gate</text>
